name: Deploy to RandSeed Sandbox

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      game_id:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and build
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
            yarn build
          elif [ -f package-lock.json ]; then
            npm ci
            npm run build
          else
            npm install
            npm run build
          fi
      - name: Create manifest
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BUILD_DIR: dist
        run: |
          node <<'NODE' > /tmp/randseed-manifest.json
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const root = process.env.BUILD_DIR;
          if (!fs.existsSync(root) || !fs.statSync(root).isDirectory()) { console.error(`Build directory does not exist: ${root}`); process.exit(1); }
          const files = [];
          function walk(dir) { for (const entry of fs.readdirSync(dir, { withFileTypes: true })) { const full = path.join(dir, entry.name); if (entry.isDirectory()) walk(full); else { const relative = path.relative(root, full).split(path.sep).join('/'); const bytes = fs.readFileSync(full); files.push({ path: relative, sha256: crypto.createHash('sha256').update(bytes).digest('hex'), size: bytes.length }); } } }
          walk(root); files.sort((a, b) => a.path.localeCompare(b.path));
          console.log(JSON.stringify({ deployment_id: process.env.DEPLOYMENT_ID, commit_sha: process.env.COMMIT_SHA, root, files, total_bytes: files.reduce((sum, file) => sum + file.size, 0) }));
          NODE
      - name: Request upload session
        env:
          RANDSEED_API_URL: https://devcreator.randseed.org
          OIDC_AUDIENCE: randseed-gamecreator
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          OIDC_TOKEN=$(node --input-type=module <<'NODE'
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          const audience = process.env.OIDC_AUDIENCE;
          if (!requestUrl || !requestToken || !audience) {
            console.error('GitHub Actions OIDC environment variables are missing');
            process.exit(1);
          }
          const url = new URL(requestUrl);
          url.searchParams.set('audience', audience);
          const response = await fetch(url, {
            headers: {
              Accept: 'application/json',
              Authorization: `bearer ${requestToken}`,
            },
          });
          const body = await response.text();
          if (!response.ok) {
            const errorBody = body.replace(/\s+/g, ' ').slice(0, 1000);
            console.error(`GitHub OIDC token request failed (${response.status} ${response.statusText}): ${errorBody}`);
            process.exit(1);
          }
          let payload;
          try {
            payload = JSON.parse(body);
          } catch {
            console.error('GitHub OIDC token endpoint returned invalid JSON');
            process.exit(1);
          }
          if (typeof payload.value !== 'string' || payload.value.length === 0) {
            console.error('GitHub OIDC token endpoint returned no token');
            process.exit(1);
          }
          process.stdout.write(payload.value);
          NODE
          )
          echo "::add-mask::$OIDC_TOKEN"; echo "OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/randseed-manifest.json'));process.stdout.write(JSON.stringify({manifest:m}))" | curl -fsS -X POST "$RANDSEED_API_URL/api/deployments/$DEPLOYMENT_ID/upload-session" -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @- > /tmp/randseed-session.json
      - name: Upload static files
        env:
          RANDSEED_API_URL: https://devcreator.randseed.org
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          BUILD_DIR: dist
        run: |
          UPLOAD_TOKEN=$(node -e "console.log(require('/tmp/randseed-session.json').upload_token)"); UPLOAD_BASE_URL=$(node -e "console.log(require('/tmp/randseed-session.json').upload_base_url)"); echo "::add-mask::$UPLOAD_TOKEN"
          node -e "const m=require('/tmp/randseed-manifest.json');for(const f of m.files)console.log(f.path+'\t'+f.size)" | while IFS=$'\t' read -r FILE_PATH FILE_SIZE; do ENCODED_PATH=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$FILE_PATH"); curl -fsS -X PUT "$UPLOAD_BASE_URL/$ENCODED_PATH" -H "Authorization: Bearer $UPLOAD_TOKEN" -H "Content-Length: $FILE_SIZE" --data-binary @"$BUILD_DIR/$FILE_PATH" > /dev/null; done
      - name: Verify and publish
        env:
          RANDSEED_API_URL: https://devcreator.randseed.org
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          curl -fsS -X POST "$RANDSEED_API_URL/api/deployments/$DEPLOYMENT_ID/upload-complete" -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$(node -e "const fs=require('fs');console.log(JSON.stringify({manifest:JSON.parse(fs.readFileSync('/tmp/randseed-manifest.json'))}))")"